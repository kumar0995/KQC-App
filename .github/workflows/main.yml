
name: KQC Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3-pip python3-venv \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev \
            libssl-dev build-essential \
            gettext autopoint

      - name: Install Buildozer
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install buildozer cython==0.29.36
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Create Buildozer configuration
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Kumar Quantum Computer
          package.name = kqc
          package.domain = org.kumar
          source.dir = .
          source.include_exts = py,json
          version = 1.0.0
          requirements = python3,kivy,numpy
          orientation = portrait
          fullscreen = 0
          android.archs = arm64-v8a
          android.api = 35
          android.minapi = 23
          android.accept_sdk_license = True
          EOF

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KQC-Android-APK
          path: bin/*.apk
          if-no-files-found: error
