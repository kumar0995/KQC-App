
name: KQC Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev \
            libssl-dev build-essential \
            gettext autopoint

      - name: Install Buildozer
        run: |
          unset PIP_USER
          python -m venv .venv
          source .venv/bin/activate
          unset PIP_USER
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Create Buildozer configuration
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Kumar Quantum Computer
          package.name = kqc
          package.domain = org.kumar
          source.dir = .
          source.include_exts = py,json
          version = 1.0.0
          requirements = python3,kivy,numpy
          orientation = portrait
          fullscreen = 0
          android.archs = arm64-v8a
          android.api = 35
          android.minapi = 24
          android.ndk = 25b
          android.accept_sdk_license = True
          log_level = 2
          EOF

      - name: Build Android APK
        run: |
          source .venv/bin/activate
          unset PIP_USER
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KQC-Android-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KQC-Build-Log
          path: buildozer.log
          if-no-files-found: ignore
