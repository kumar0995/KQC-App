name: KQC Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user buildozer cython==0.29.36

      - name: Create Buildozer configuration
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Kumar Quantum Computer
          package.name = kqc
          package.domain = org.kumar
          source.dir = .
          source.include_exts = py,json
          version = 1.0.0
          requirements = python3,kivy,numpy
          orientation = portrait
          fullscreen = 0
          android.archs = arm64-v8a
          android.minapi = 23
          EOF
      - name: Install Android SDK Build Tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35"
      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KQC-Android-APK
          path: bin/*.apk
